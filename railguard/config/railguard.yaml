railguard_node:
  ros__parameters:
    input_topic: /lidar_points                        # doubleT_obstacle: /sensing/lidar/hesai128/pointcloud
    weights: /opt/railguard/weights/path/best.pt
    refiner: /opt/railguard/weights/refine            # "" = no refiner (centerline only as far as the rails are seen)
    drop_intensity: true                              # the model was trained without intensity
    # Obstacle filtering (metres); read at node startup.
    train_width_m: 2.1
    train_height_m: 3.0
    min_forward_m: 1.5
    max_forward_m: 150.0                             # can use the refined line up to 200 m
    min_height_above_track_m: 0.10
    near_min_height_above_track_m: 0.20
    near_height_distance_m: 15.0
    min_cluster_points: 4
    count_unique_xyz: true                          # duplicate XYZ records do not add cluster support
    # Odometry aligns candidate groups; neural inference still uses one scan.
    initial_speed_m_s: 0.0
    tracking_match_distance_m: 1.0
    tracking_window_scans: 5
    tracking_minimum_hits: 4
    tracking_immediate_unique_points_gt: 50          # strictly >50, per group
    tracking_max_gap_s: 2.0
