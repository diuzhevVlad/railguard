name: railguard
services:
  web:
    image: railguard-web:latest
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OBSTACLE_RAIL_DEVICE: cuda
      OBSTACLE_WEIGHTS_200_DIR: /models/200m_weights
      OBSTACLE_WEIGHTS_400_DIR: /models/400m_weights
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
      - ./outputs:/output
      - ./200m_weights:/models/200m_weights:ro
      - ./400m_weights:/models/400m_weights:ro
    restart: unless-stopped
  node:
    image: railguard-node:latest
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      RAILGUARD_BAG: "${RAILGUARD_BAG:-}"                       # recording directory name -> GT odometry preset (speed, seed interval), same table as the web app
      RAILGUARD_INITIAL_SPEED: "${RAILGUARD_INITIAL_SPEED:-}"   # KISS-ICP initial speed, m/s, for recordings without a preset; one of the two is required
      RAILGUARD_INPUT_TOPIC: "${RAILGUARD_INPUT_TOPIC:-}"       # PointCloud2 topic (empty = YAML value)
      RAILGUARD_ODOMETRY: "${RAILGUARD_ODOMETRY:-true}"          # false = no KISS-ICP, single-scan detections (initial speed not needed)
      RAILPATH_ROWS: "${RAILPATH_ROWS:-200}"                    # must match the refiner in weights/ (200 or 400)
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/bags:ro
      - ./weights:/opt/railguard/weights:ro
      - ./railguard/config:/opt/railguard/config:ro
    command: ["ros2", "launch", "railguard", "railguard.launch.py", "config:=/opt/railguard/config/railguard.yaml"]
    restart: unless-stopped
