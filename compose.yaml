name: railguard
services:
  web:
    image: railguard-web
    build:
      context: .
      dockerfile: Dockerfile.web
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OBSTACLE_RAIL_DEVICE: cuda
      OBSTACLE_WEIGHTS_200_DIR: /models/200m_weights
      OBSTACLE_WEIGHTS_400_DIR: /models/400m_weights
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
      - ./outputs:/output
      - ./200m_weights:/models/200m_weights:ro
      - ./400m_weights:/models/400m_weights:ro
    restart: unless-stopped
  node:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/bags:ro
      - ./outputs:/bags/outputs:ro
      - ./railguard/config:/opt/railguard/config:ro
    command: ["ros2", "launch", "railguard", "railguard.launch.py", "config:=/opt/railguard/config/railguard.yaml"]
    restart: unless-stopped
