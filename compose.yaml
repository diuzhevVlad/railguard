name: railguard
services:
  web:
    image: railguard-web
    build:
      context: .
      dockerfile: Dockerfile.web
    gpus: all
    environment:
      OBSTACLE_RAIL_DEVICE: cuda
      OBSTACLE_WEIGHTS_DIR: /weights
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
      - ./outputs:/output
      - ./weights:/weights:ro
    restart: unless-stopped
